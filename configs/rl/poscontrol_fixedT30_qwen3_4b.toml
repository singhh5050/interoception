# POSITIVE CONTROL: specialist trained at a FIXED budget T=30s (windowed λ=0.30,
# σ=0.10), target_s pinned to 30s. Calibrated-by-construction accuracy ceiling at T=30.
# WINDOWED σ_under sweep @ 200 steps, ALL FRESH — cell σ_under=0.25 (gentle).
#
# Clean 200-step redo of the σ_under sweep (Harsh+Nicole, 2026-06-06): all three
# σ_under ∈ {0.25, 0.17, 0.10} run FRESH from step 0 at 200 steps with an identical
# schedule (no resume / LR-scheduler conflict, perfectly matched). σ_under=0.25 is the
# gentle-under-penalty end (our own copy; the 100-step version was Nicole's windowed_l30).
# Only sigma_under differs across the three cells; λ=0.30, σ_over=0.10 fixed.

max_steps = 200
seq_len = 2048
output_dir = "/cache/runs/poscontrol_fixedT30_qwen3_4b"

[ckpt]
interval = 25

[wandb]
project = "interoception-poscontrol-fixedT30"
entity = "singhh5050-stanford-university"
name = "poscontrol-fixedT30-qwen3-4b"

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[trainer.model.lora]
rank = 32
alpha = 32.0
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[trainer.ckpt.weights]
save_adapter_separately = true

[trainer.optim]
type = "adamw"
lr = 5e-5
max_norm = 1.0
betas1 = 0.9
betas2 = 0.999
weight_decay = 0.01

[trainer.loss]
type = "default"
kl_tau = 1e-3

[trainer.scheduler]
type = "linear"
warmup_steps = 2
decay_steps = 2
min_lr = 0.0

[orchestrator]
batch_size = 128
rollouts_per_example = 16
seed = 0

[[orchestrator.filters]]
type = "gibberish"
[[orchestrator.filters]]
type = "repetition"
[[orchestrator.filters]]
type = "zero_advantage"
enforce = false

[orchestrator.train.sampling]
max_completion_tokens = 128
temperature = 1.0

[[orchestrator.train.env]]
id = "interoception-countdown"
name = "poscontrol-fixedT30-train"
args = { problems_jsonl = "/root/data/train.jsonl", target_s_min = 30.0, target_s_max = 30.0, target_s_dist = "uniform", dataset_seed = 0, timing_source = "sim", hardware = "A100_80GB", sim_model = "Qwen3-4B", max_turns = 16, reward_shape = "windowed_additive", lambda_f = 0.30, sigma_under = 0.10, sigma_over = 0.10, attempt_bonus = 0.0, enforce_max_time = false, reward_time_term = true, prompt_variant = "remaining_budget" }

[orchestrator.eval]
interval = 50

[orchestrator.eval.sampling]
max_completion_tokens = 128
temperature = 1.0

[[orchestrator.eval.env]]
id = "interoception-countdown"
name = "poscontrol-fixedT30-eval"
num_examples = 498
rollouts_per_example = 1
args = { problems_jsonl = "/root/data/eval.jsonl", target_s_min = 30.0, target_s_max = 30.0, target_s_dist = "uniform", dataset_seed = 777, timing_source = "sim", hardware = "A100_80GB", sim_model = "Qwen3-4B", max_turns = 16, reward_shape = "windowed_additive", lambda_f = 0.30, sigma_under = 0.10, sigma_over = 0.10, attempt_bonus = 0.0, enforce_max_time = false, reward_time_term = true, prompt_variant = "remaining_budget" }

[inference]
enable_fp32_lm_head = true
