# 2-STAGE CURRICULUM / Stage 2 cell — kl_tau=1e-3 (β=1e-3).
#
# Stage 1 = v2-l30 step_200 (additive c+0.30·f, 200 steps). r=+0.87, acc=0.17 matched.
# That LoRA has been merged into Qwen3-4B base and saved as
#   /cache/merged_models/qwen3-4b-v2-l30-step200/
# Prime-rl loads that as the "base" model — so kl_tau (which regularizes the
# stage-2 LoRA against the model's base weights) is naturally anchoring the
# stage-2 policy against the stage-1 (pacing) policy.
#
# Stage-2 reward: STRICT c-only (additive shape with lambda_f=0). The question
# we're testing: can KL alone (no f signal in reward) preserve pacing while
# correctness improves?
#
# β-sweep: kl_tau ∈ {0, 1e-4, 1e-3, 1e-2, 1e-1} across 5 sibling configs.
#   - β=0:    no anchor; should unwind pacing (validation that KL is doing work)
#   - β=1e-1: heavy anchor; might prevent learning
#   - β=1e-3: current cell (project default value for kl_tau)

max_steps = 200
seq_len = 2048
output_dir = "/cache/runs/stage2_kl_b4_qwen3_4b"

[ckpt]
interval = 25

[wandb]
project = "interoception-stage2-b4"
entity = "singhh5050-stanford-university"
name = "stage2-kl-b4"

[model]
# IMPORTANT: this is the v2-l30 LoRA merged into Qwen3-4B base.
# Prime-rl treats this as a regular HF model; kl_tau anchors against it.
name = "/cache/merged_models/qwen3-4b-v2-l30-step200"

[trainer.model.lora]
rank = 32
alpha = 32.0
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[trainer.ckpt.weights]
save_adapter_separately = true

[trainer.optim]
type = "adamw"
lr = 5e-5
max_norm = 1.0
betas1 = 0.9
betas2 = 0.999
weight_decay = 0.01

[trainer.loss]
type = "default"
kl_tau = 1e-4    # ← β-sweep variable

[trainer.scheduler]
type = "linear"
warmup_steps = 4
decay_steps = 4
min_lr = 0.0

[orchestrator]
batch_size = 128
rollouts_per_example = 16
seed = 0

[[orchestrator.filters]]
type = "gibberish"
[[orchestrator.filters]]
type = "repetition"
[[orchestrator.filters]]
type = "zero_advantage"
enforce = false

[orchestrator.train.sampling]
max_completion_tokens = 128
temperature = 1.0

[[orchestrator.train.env]]
id = "interoception-countdown"
name = "stage2-kl-b4-train"
# lambda_f = 0.0 ⇒ reward = c only (additive shape with f-coefficient zeroed out)
args = { problems_jsonl = "/root/data/train.jsonl", target_s_min = 1.0, target_s_max = 40.0, target_s_dist = "uniform", dataset_seed = 0, timing_source = "sim", hardware = "A100_80GB", sim_model = "Qwen3-4B", max_turns = 16, reward_shape = "additive", lambda_f = 0.0, attempt_bonus = 0.0, enforce_max_time = false, reward_time_term = true, prompt_variant = "remaining_budget" }

[orchestrator.eval]
interval = 50

[orchestrator.eval.sampling]
max_completion_tokens = 128
temperature = 1.0

[[orchestrator.eval.env]]
id = "interoception-countdown"
name = "stage2-kl-b4-eval-uniform"
num_examples = 498
rollouts_per_example = 1
args = { problems_jsonl = "/root/data/eval.jsonl", target_s_min = 1.0, target_s_max = 40.0, target_s_dist = "uniform", dataset_seed = 777, timing_source = "sim", hardware = "A100_80GB", sim_model = "Qwen3-4B", max_turns = 16, reward_shape = "additive", lambda_f = 0.0, attempt_bonus = 0.0, enforce_max_time = false, reward_time_term = true, prompt_variant = "remaining_budget" }

[inference]
enable_fp32_lm_head = true
